<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create a CorpIT Helpdesk Support Ticket</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #20242B;
    font-family: "Segoe UI", sans-serif;
    padding: 32px 16px;
  }
  .slide {
    width: min(1280px, 96vw);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    background: #FAFAFA;
  }
  .slide svg { display: block; width: 100%; height: auto; }
  .hint { color: #8A93A3; font-size: 14px; letter-spacing: 0.3px; }
  .prompt {
    font-size: 16px;
    line-height: 1.5;
    padding: 12px 16px 10px;
    border-bottom: 1px solid #D5DCE5;
  }
  .prompt .prompt-label {
    display: inline;
    margin: 0;
    padding: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .prompt p { margin: 0; padding: 0; }
</style>
</head>
<body>

<div class="slide">

  <div class="prompt">
    <h2 class="prompt-label" style="margin-bottom: 0; padding-bottom: 0; color: green;">Prompt: </h2>
    <i style="color: green;">To create a four-step process for creating a CorpIT Helpdesk support ticket, structured as a horizontal list row with icon and arrow indicators.</i>
    <p></p>
  </div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FAFAFA"/>

  <!-- Title zone -->
  <g id="zone-title">
    <text x="64" y="88" font-size="16" font-weight="700" fill="#1565C0" letter-spacing="3">CORPIT SELF-SERVICE</text>
    <text x="64" y="130" font-size="44" font-weight="700" fill="#212121">Create a CorpIT Helpdesk Support Ticket</text>
    <text x="64" y="166" font-size="24" fill="#5F6B7A">Four steps: from signing in to a ticket number you can track</text>
  </g>

  <!-- Steps zone -->
  <g id="zone-steps">

    <!-- Card 1 -->
    <rect x="64" y="240" width="252" height="320" rx="14" fill="#EDF2F8"/>
    <circle cx="190" cy="240" r="22" fill="#1565C0" stroke="#FAFAFA" stroke-width="4"/>
    <text x="190" y="248" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <g transform="translate(166,300) scale(2)" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
      <path d="M21 12h-13l3 -3"/>
      <path d="M11 15l-3 -3"/>
    </g>
    <text x="190" y="398" font-size="24" font-weight="700" fill="#0D47A1" text-anchor="middle">Sign in</text>
    <text x="190" y="436" font-size="24" fill="#5F6B7A" text-anchor="middle">Open the portal and<tspan x="190" dy="30">log in with your</tspan><tspan x="190" dy="30">corporate SSO.</tspan></text>

    <!-- Card 2 -->
    <rect x="364" y="240" width="252" height="320" rx="14" fill="#EDF2F8"/>
    <circle cx="490" cy="240" r="22" fill="#1565C0" stroke="#FAFAFA" stroke-width="4"/>
    <text x="490" y="248" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <g transform="translate(466,300) scale(2)" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h6v6h-6l0 -6"/>
      <path d="M14 4h6v6h-6l0 -6"/>
      <path d="M4 14h6v6h-6l0 -6"/>
      <path d="M14 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
    </g>
    <text x="490" y="398" font-size="24" font-weight="700" fill="#0D47A1" text-anchor="middle">Choose type</text>
    <text x="490" y="436" font-size="24" fill="#5F6B7A" text-anchor="middle">Pick Incident or<tspan x="490" dy="30">Service Request,</tspan><tspan x="490" dy="30">then the category.</tspan></text>

    <!-- Card 3 -->
    <rect x="664" y="240" width="252" height="320" rx="14" fill="#EDF2F8"/>
    <circle cx="790" cy="240" r="22" fill="#1565C0" stroke="#FAFAFA" stroke-width="4"/>
    <text x="790" y="248" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <g transform="translate(766,300) scale(2)" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
      <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2"/>
      <path d="M9 17h6"/>
      <path d="M9 13h6"/>
    </g>
    <text x="790" y="398" font-size="24" font-weight="700" fill="#0D47A1" text-anchor="middle">Describe issue</text>
    <text x="790" y="436" font-size="24" fill="#5F6B7A" text-anchor="middle">Add subject and<tspan x="790" dy="30">symptoms, attach</tspan><tspan x="790" dy="30">screenshots/logs.</tspan></text>

    <!-- Card 4 -->
    <rect x="964" y="240" width="252" height="320" rx="14" fill="#EDF2F8"/>
    <circle cx="1090" cy="240" r="22" fill="#1565C0" stroke="#FAFAFA" stroke-width="4"/>
    <text x="1090" y="248" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <g transform="translate(1066,300) scale(2)" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l0 2"/>
      <path d="M15 11l0 2"/>
      <path d="M15 17l0 2"/>
      <path d="M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-3a2 2 0 0 0 0 -4v-3a2 2 0 0 1 2 -2"/>
    </g>
    <text x="1090" y="398" font-size="24" font-weight="700" fill="#0D47A1" text-anchor="middle">Submit &amp; track</text>
    <text x="1090" y="436" font-size="24" fill="#5F6B7A" text-anchor="middle">Send it and save<tspan x="1090" dy="30">the ticket number</tspan><tspan x="1090" dy="30">to track updates.</tspan></text>

    <!-- Arrows between cards -->
    <path d="M326 388 h16 v-8 l14 20 -14 20 v-8 h-16 z" fill="#7EA6E0"/>
    <path d="M626 388 h16 v-8 l14 20 -14 20 v-8 h-16 z" fill="#7EA6E0"/>
    <path d="M926 388 h16 v-8 l14 20 -14 20 v-8 h-16 z" fill="#7EA6E0"/>
  </g>

  <!-- Footer zone -->
  <g id="zone-footer">
    <line x1="64" y1="616" x2="1216" y2="616" stroke="#D5DCE5" stroke-width="1"/>
    <text x="640" y="644" font-size="16" fill="#5F6B7A" text-anchor="middle">CorpIT Helpdesk · Internal guide · Sources: zendesk.com, atlassian.com, itsm.tools</text>
  </g>
</svg>
</div>

<p class="hint">CorpIT Helpdesk ticket flow · rendered from the deck source · printable via your browser</p>

</body>
</html>
